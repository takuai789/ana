<!DOCTYPE html>
<html lang="ja">
<head>

<meta name="mobile-web-app-capable" content="yes" />

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230B308E'/%3E%3Cstop offset='1' stop-color='%2300AFF0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='34' font-family='Arial,sans-serif' font-size='44' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='central'%3E3%3C/text%3E%3C/svg%3E" />
<title>300万メーター</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #F2F2F7; --card: #FFFFFF; --ink: #1a1a1a;
    --secondary: rgba(60,60,67,0.6); --tertiary: rgba(60,60,67,0.32); --sep: rgba(60,60,67,0.16);
    --navy: #0B308E; --navy-soft: #1456B0;
    --mohican: #00AFF0; --mohican-soft: #E1F4FD;
    --amber: #F59E0B; --amber-soft: #FEF3E2;
    --green: #2FA66A; --green-soft: #E7F5EE;
    --blue: #0B308E;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif; color: var(--ink); font-size: 16px; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
  #app { height: var(--app-height, 100%); display: flex; flex-direction: column; padding-top: var(--safe-top); }

  .view { display: none; flex-direction: column; flex: 1; min-height: 0; }
  .view.active { display: flex; }
  .navbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; min-height: 44px; position: relative; background: rgba(242,242,247,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 0.5px solid var(--sep); z-index: 10; }
  .navbar .title { font-size: 17px; font-weight: 700; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; white-space: nowrap; }
  .navbar .lead { font-size: 13px; color: var(--secondary); font-weight: 500; }
  .icon-btn { min-width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; color: var(--navy); background: none; border: 0; cursor: pointer; font-size: 22px; font-weight: 500; font-family: inherit; }
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 14px calc(20px + var(--safe-bottom)); }

  .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .sec-label { font-size: 12px; font-weight: 600; color: var(--secondary); margin: 6px 2px 8px; }

  .hero { background: linear-gradient(150deg, var(--navy) 0%, var(--navy-soft) 100%); color: #fff; border-radius: 20px; padding: 20px; margin-bottom: 14px; }
  .hero .lbl { font-size: 12px; opacity: .8; font-weight: 500; }
  .hero .big { font-size: 34px; font-weight: 700; letter-spacing: -.01em; margin: 2px 0; }
  .hero .big small { font-size: 18px; font-weight: 600; }
  .hero .sub { font-size: 13px; opacity: .85; }
  .gauge { height: 12px; border-radius: 99px; background: rgba(255,255,255,.18); overflow: hidden; margin: 14px 0 8px; }
  .gauge > i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--mohican), #5fd0ff); transition: width .5s cubic-bezier(.32,.72,0,1); }
  .hero-row { display: flex; justify-content: space-between; font-size: 12px; opacity: .85; }

  .forecast { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .forecast .k { font-size: 12px; color: var(--secondary); font-weight: 600; }
  .forecast .v { font-size: 26px; font-weight: 700; margin: 2px 0 6px; color: var(--navy); }
  .forecast .d { font-size: 13px; line-height: 1.7; color: #38465e; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .stat { background: var(--card); border-radius: 14px; padding: 13px 14px; }
  .stat .k { font-size: 11.5px; color: var(--secondary); font-weight: 500; }
  .stat .v { font-size: 20px; font-weight: 700; margin-top: 2px; }
  .stat .v small { font-size: 12px; font-weight: 600; color: var(--secondary); }

  .pill { display: inline-flex; align-items: center; font-size: 12.5px; font-weight: 600; padding: 5px 11px; border-radius: 99px; }
  .pill.green { background: var(--green-soft); color: var(--green); }
  .pill.amber { background: var(--amber-soft); color: #B26A00; }
  .pill.blue { background: var(--mohican-soft); color: #0678A8; }
  .pill.gray { background: #ECECEF; color: var(--secondary); }

  .msg { border-radius: 14px; padding: 14px 15px; font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; margin-bottom: 12px; }
  .msg.calm { background: #EEF1F6; color: #38465e; }
  .msg.good { background: var(--green-soft); color: #1f6b46; }
  .msg.warn { background: var(--amber-soft); color: #5b4a2a; }
  .msg.tap { cursor: pointer; display: flex; align-items: center; gap: 10px; }

  .chart { background: var(--card); border-radius: 16px; padding: 14px 10px 8px; margin-bottom: 12px; }
  .chart svg { display: block; width: 100%; height: auto; }
  .legend { display: flex; gap: 14px; justify-content: center; font-size: 11px; color: var(--secondary); padding: 6px 0 2px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { display: inline-block; width: 14px; height: 0; border-top: 2.5px solid; }

  .list { background: var(--card); border-radius: 16px; overflow: hidden; margin-bottom: 12px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-bottom: 0.5px solid var(--sep); cursor: pointer; }
  .row:last-child { border-bottom: 0; }
  .row:active { background: #f6f6f8; }
  .row .main { flex: 1; min-width: 0; }
  .row .ttl { font-size: 15px; font-weight: 600; }
  .row .meta { font-size: 12px; color: var(--secondary); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .amt { font-size: 15px; font-weight: 700; text-align: right; white-space: nowrap; }
  .row .amt small { font-size: 11.5px; font-weight: 600; display: block; margin-top: 1px; color: var(--green); }
  .chev { color: var(--tertiary); }
  .empty { text-align: center; color: var(--secondary); font-size: 13.5px; padding: 34px 16px; line-height: 1.8; }

  .btn { width: 100%; border: 0; border-radius: 13px; padding: 14px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
  .btn.primary { background: var(--navy); color: #fff; margin-bottom: 12px; }
  .btn.ghost { background: #E7EBF3; color: var(--navy); }

  .tabbar { display: flex; border-top: 0.5px solid var(--sep); background: rgba(248,248,250,0.94); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding-bottom: var(--safe-bottom); }
  .tab { flex: 1; border: 0; background: none; padding: 7px 0 5px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--tertiary); cursor: pointer; font-family: inherit; }
  .tab.active { color: var(--navy); }
  .tab span { font-size: 10px; font-weight: 600; }
  .tab svg { width: 25px; height: 25px; }

  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 200; }
  .sheet-bg.show { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 201; background: var(--bg); border-radius: 20px 20px 0 0; transform: translateY(100%); transition: transform .3s cubic-bezier(.32,.72,0,1); max-height: 92%; display: flex; flex-direction: column; padding-bottom: var(--safe-bottom); }
  .sheet.show { transform: translateY(0); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
  .sheet-head .t { font-size: 17px; font-weight: 700; }
  .sheet-head button { background: none; border: 0; font-family: inherit; font-size: 15px; font-weight: 600; color: var(--blue); cursor: pointer; }
  .sheet-body { overflow-y: auto; padding: 4px 16px 20px; }
  .del-btn { width: 100%; border: 0; background: none; color: #B26A00; font-family: inherit; font-size: 14px; font-weight: 600; padding: 12px; cursor: pointer; }

  .field { margin-bottom: 14px; }
  .field > label { display: block; font-size: 12.5px; font-weight: 600; color: var(--secondary); margin: 0 2px 6px; }
  .field .hint { font-size: 11.5px; color: var(--tertiary); margin: 5px 2px 0; line-height: 1.5; }
  input[type=text], input[type=number], input[type=date] { width: 100%; font-family: inherit; font-size: 16px; color: var(--ink); background: var(--card); border: 0; border-radius: 12px; padding: 13px 14px; outline: none; -webkit-appearance: none; appearance: none; min-height: 48px; }
  input[type=number] { text-align: right; }
  .inwrap { position: relative; }
  .inwrap input { padding-right: 48px; }
  .inwrap .unit { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--secondary); pointer-events: none; }
  input.big { font-size: 26px; font-weight: 700; padding-top: 16px; padding-bottom: 16px; }
  .prev-note { font-size: 12.5px; color: var(--secondary); margin: 8px 2px 0; }
  .prev-note b { color: var(--green); }

  #updateBanner { position: fixed; left: 12px; right: 12px; bottom: calc(var(--safe-bottom) + 70px); z-index: 1000; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--navy); color: #fff; border: 0; border-radius: 14px; padding: 14px 18px; font-family: inherit; font-size: 14px; font-weight: 600; box-shadow: 0 8px 28px rgba(11,48,142,0.4); cursor: pointer; transform: translateY(160%); transition: transform 0.35s cubic-bezier(.32,.72,0,1); }
  #updateBanner.show { transform: translateY(0); }
  .toast { position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 78px); transform: translateX(-50%) translateY(20px); background: rgba(20,20,22,.92); color: #fff; font-size: 13px; font-weight: 600; padding: 11px 18px; border-radius: 99px; opacity: 0; transition: all .25s; z-index: 1100; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <div id="view-home" class="view active">
    <div class="navbar"><span class="lead" id="homeLead"></span><span class="title">300万メーター</span><button class="icon-btn" id="homeAdd" aria-label="記録する">＋</button></div>
    <div class="scroll" id="homeScroll"></div>
  </div>
  <div id="view-log" class="view">
    <div class="navbar"><span style="width:34px;"></span><span class="title">記録</span><button class="icon-btn" id="logAdd" aria-label="記録する">＋</button></div>
    <div class="scroll" id="logScroll"></div>
  </div>
  <div id="view-settings" class="view">
    <div class="navbar"><span style="width:34px;"></span><span class="title">設定</span><span style="width:34px;"></span></div>
    <div class="scroll" id="settingsScroll"></div>
  </div>

  <div class="tabbar">
    <button class="tab active" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 9v11h5v-6h6v6h5V9z"/></svg><span>ホーム</span></button>
    <button class="tab" data-v="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span>記録</span></button>
    <button class="tab" data-v="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>設定</span></button>
  </div>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <div class="sheet-head"><button id="sheetCancel">キャンセル</button><span class="t" id="sheetTitle"></span><button id="sheetSave">保存</button></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => Array.from(document.querySelectorAll(s));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const now = () => Date.now();

  const APP_VERSION = '2.0.0';

  // ---------- IndexedDB ----------
  const DB_NAME = 'ana300-db';
  const DB_VERSION = 3;                    // v2.0: snapshots ストア追加（旧ストアは使わない）
  const STORES = ['settings', 'snapshots'];
  let _db = null;
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => { const db = req.result; for (const s of STORES) if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' }); };
      req.onsuccess = () => { _db = req.result; resolve(_db); };
      req.onerror = () => reject(req.error);
    });
  }
  const store = (s, m='readonly') => _db.transaction(s, m).objectStore(s);
  const getAll = (s) => new Promise((res, rej) => { const r = store(s).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const put = (s, v) => new Promise((res, rej) => { const r = store(s,'readwrite').put(v); r.onsuccess = () => res(); r.onerror = () => rej(r.error); });
  const del = (s, id) => new Promise((res, rej) => { const r = store(s,'readwrite').delete(id); r.onsuccess = () => res(); r.onerror = () => rej(r.error); });

  // ---------- state ----------
  const DEFAULTS = {
    id: 'main',
    target_amount: 3000000,
    period_start: '2026-12-16',
    period_end: '2027-12-15',
    assumed_monthly: 200000,   // 記録が少ないうちに使う想定ペース
  };
  const state = { settings: { ...DEFAULTS }, snaps: [] };
  async function loadAll() {
    const s = (await getAll('settings'))[0];
    state.settings = s ? { ...DEFAULTS, ...s, id: 'main' } : { ...DEFAULTS };
    state.snaps = (await getAll('snapshots')).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  }

  // ---------- format ----------
  const man = (n) => { const v = (n || 0) / 10000; const r = Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 10) / 10; return r.toLocaleString('ja-JP') + '万'; };
  const signMan = (n) => (n >= 0 ? '+' : '') + man(n);
  const pad = (n) => String(n).padStart(2, '0');
  const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const fromISO = (s) => new Date(s + 'T00:00:00');
  const ymLabel = (d) => `${d.getFullYear()}年${d.getMonth() + 1}月`;
  const mdLabel = (s) => { const d = fromISO(s); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`; };
  const DAY = 86400000, MONTH_DAYS = 30.44;
  const monthsBetween = (a, b) => (b - a) / DAY / MONTH_DAYS;
  function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function parseNum(v) { const n = Number(String(v).replace(/[^0-9.-]/g, '')); return isNaN(n) ? 0 : n; }
  const manToYen = (v) => Math.round(parseNum(v) * 10000);
  const yenToMan = (y) => Math.round(((y || 0) / 10000) * 1000) / 1000;

  // その月の末日（記録日の初期値）
  function defaultSnapDate() {
    const t = new Date();
    const last = new Date(t.getFullYear(), t.getMonth() + 1, 0);
    // 月の前半なら「先月末」の記録とみなす
    if (t.getDate() <= 10) return toISO(new Date(t.getFullYear(), t.getMonth(), 0));
    return toISO(last);
  }

  // ---------- 試算 ----------
  function forecast() {
    const s = state.settings;
    const target = s.target_amount;
    const start = fromISO(s.period_start), end = fromISO(s.period_end);
    const totalMonths = Math.max(0.1, monthsBetween(start, end));
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const latest = state.snaps[state.snaps.length - 1] || null;
    const cur = latest ? latest.cumulative : 0;
    const asOf = latest ? fromISO(latest.date) : (today < start ? start : today);
    const elapsed = Math.max(0, monthsBetween(start, asOf));
    const remainMonths = Math.max(0, monthsBetween(asOf, end));
    const remain = Math.max(0, target - cur);

    // ペース：1か月以上たっていれば実績、それまでは想定値
    let pace, paceSrc;
    if (latest && elapsed >= 1) { pace = cur / elapsed; paceSrc = 'actual'; }
    else { pace = s.assumed_monthly; paceSrc = 'assumed'; }

    const needMonthly = remainMonths > 0 ? remain / remainMonths : remain;
    const landing = cur + pace * remainMonths;
    let reachDate = null, monthsToReach = null;
    if (cur >= target) { reachDate = asOf; monthsToReach = 0; }
    else if (pace > 0) { monthsToReach = remain / pace; reachDate = new Date(asOf.getTime() + monthsToReach * MONTH_DAYS * DAY); }

    // 前回記録からの増加
    let lastDiff = null;
    if (state.snaps.length >= 2) { const a = state.snaps[state.snaps.length - 2], b = latest; lastDiff = b.cumulative - a.cumulative; }

    let status;
    if (cur >= target) status = { key: 'done', label: '達成', cls: 'green' };
    else if (reachDate && reachDate <= end) status = { key: 'ontrack', label: '期間内に届く見込み', cls: 'green' };
    else if (landing >= target * 0.9) status = { key: 'close', label: 'あと少し', cls: 'amber' };
    else status = { key: 'behind', label: '届かない見込み', cls: 'gray' };

    const beforeStart = asOf < start && !latest;
    return { target, start, end, totalMonths, cur, asOf, elapsed, remainMonths, remain, pace, paceSrc, needMonthly, landing, reachDate, monthsToReach, lastDiff, status, latest, beforeStart };
  }

  // ---------- リマインド ----------
  function reminder() {
    const t = new Date();
    const latest = state.snaps[state.snaps.length - 1];
    const prevMonthEnd = new Date(t.getFullYear(), t.getMonth(), 0);
    const curYM = `${t.getFullYear()}-${pad(t.getMonth() + 1)}`;
    const prevYM = toISO(prevMonthEnd).slice(0, 7);
    const lastYM = latest ? latest.date.slice(0, 7) : null;
    if (t.getDate() >= 25 && lastYM !== curYM) return `${t.getMonth() + 1}月末の記録の時期です。利用実績照会の累計を入れましょう`;
    if (t.getDate() <= 10 && (!lastYM || lastYM < prevYM)) return `${prevMonthEnd.getMonth() + 1}月末の記録がまだです`;
    return '';
  }

  // ---------- グラフ ----------
  function chartSVG(f) {
    const W = 340, H = 190, L = 34, R = 10, T = 12, B = 26;
    const pw = W - L - R, ph = H - T - B;
    const t0 = f.start.getTime(), t1 = f.end.getTime();
    const yMax = Math.max(f.target * 1.08, f.landing, ...state.snaps.map(s => s.cumulative)) || f.target;
    const x = (ms) => L + Math.max(0, Math.min(1, (ms - t0) / (t1 - t0))) * pw;
    const y = (v) => T + ph - (v / yMax) * ph;

    let g = '';
    // y軸目盛（100万ごと）
    for (let v = 0; v <= yMax; v += 1000000) {
      g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(60,60,67,.10)" stroke-width="1"/>`;
      g += `<text x="${L - 6}" y="${y(v) + 3.5}" font-size="9.5" text-anchor="end" fill="rgba(60,60,67,.55)">${v / 10000}万</text>`;
    }
    // x軸ラベル（開始・中間・終了）
    const mid = new Date((t0 + t1) / 2);
    [[f.start, 'start'], [mid, 'middle'], [f.end, 'end']].forEach(([d, a]) => {
      g += `<text x="${x(d.getTime())}" y="${H - 8}" font-size="9.5" text-anchor="${a}" fill="rgba(60,60,67,.55)">${d.getFullYear() % 100}/${d.getMonth() + 1}</text>`;
    });
    // 目標ライン
    g += `<line x1="${L}" x2="${W - R}" y1="${y(f.target)}" y2="${y(f.target)}" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="5 4"/>`;
    g += `<text x="${W - R}" y="${y(f.target) - 5}" font-size="10" font-weight="700" text-anchor="end" fill="#B26A00">${f.target / 10000}万</text>`;
    // 実績
    const pts = [[t0, 0], ...state.snaps.filter(s => fromISO(s.date).getTime() >= t0).map(s => [fromISO(s.date).getTime(), s.cumulative])];
    if (pts.length >= 2) {
      const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ');
      const area = d + ` L${x(pts[pts.length - 1][0]).toFixed(1)},${y(0)} L${x(t0)},${y(0)} Z`;
      g += `<path d="${area}" fill="rgba(11,48,142,.08)"/>`;
      g += `<path d="${d}" fill="none" stroke="#0B308E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
    // 見込み（最新→期間末）
    const lastP = pts[pts.length - 1];
    if (f.remainMonths > 0) {
      g += `<line x1="${x(lastP[0])}" y1="${y(lastP[1])}" x2="${x(t1)}" y2="${y(f.landing)}" stroke="#00AFF0" stroke-width="2" stroke-dasharray="4 4"/>`;
      g += `<circle cx="${x(t1)}" cy="${y(f.landing)}" r="3.5" fill="#fff" stroke="#00AFF0" stroke-width="2"/>`;
    }
    pts.slice(1).forEach(p => { g += `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="3.5" fill="#0B308E" stroke="#fff" stroke-width="1.5"/>`; });
    // 今日
    const today = Date.now();
    if (today > t0 && today < t1) g += `<line x1="${x(today)}" x2="${x(today)}" y1="${T}" y2="${T + ph}" stroke="rgba(60,60,67,.25)" stroke-width="1"/>`;

    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="累計利用額の推移">${g}</svg>`;
  }

  // ===================== ホーム =====================
  function renderHome() {
    const f = forecast();
    const pct = Math.min(100, f.cur / f.target * 100);
    $('#homeLead').textContent = f.beforeStart ? `${f.start.getMonth() + 1}/${f.start.getDate()}開始` : `残り${Math.round(f.remainMonths)}か月`;
    const rem = reminder();

    // 試算カード
    let fcValue, fcDesc;
    if (f.status.key === 'done') {
      fcValue = '達成済み';
      fcDesc = `${mdLabel(f.latest.date)}時点で ${man(f.cur)}円。おつかれさまでした。`;
    } else if (!f.reachDate) {
      fcValue = '—';
      fcDesc = 'ペースが出せません。設定の想定月平均を入れてください。';
    } else {
      fcValue = `${ymLabel(f.reachDate)}ごろ`;
      const inTime = f.reachDate <= f.end;
      fcDesc = `このペース（月${man(f.pace)}円${f.paceSrc === 'assumed' ? '・想定値' : ''}）なら、あと約${Math.ceil(f.monthsToReach)}か月で300万円に届く見込みです。` +
        (inTime ? `\n判定期間の終わり（${mdLabel(state.settings.period_end)}）まで余裕があります。`
                : `\n判定期間の終わり（${mdLabel(state.settings.period_end)}）には約${man(f.target - f.landing)}円足りない見込みです。`);
    }

    // 必要ペースとの比較メッセージ
    let msgCls = 'calm', msg = '';
    if (f.status.key === 'done') { msgCls = 'good'; msg = '目標に届きました。ここから先は無理に寄せる必要はありません。'; }
    else if (f.remainMonths <= 0) { msg = '判定期間が終わっています。設定で次の期間に切り替えられます。'; }
    else {
      const gap = f.pace - f.needMonthly;
      if (gap >= 0) { msgCls = 'good'; msg = `期間内に届くには月${man(f.needMonthly)}円ペースが必要。\n今のペースはそれを月${man(gap)}円上回っています。`; }
      else { msgCls = 'warn'; msg = `期間内に届くには月${man(f.needMonthly)}円ペースが必要。\n今のペースより月${man(-gap)}円多く使う計算です。必要な支出の寄せ替えで埋まるかを目安に。`; }
    }

    $('#homeScroll').innerHTML = `
      ${rem ? `<div class="msg calm tap" id="remTap"><span style="flex:1;">${esc(rem)}</span><span class="chev">›</span></div>` : ''}
      <div class="hero">
        <div class="lbl">${f.latest ? `${mdLabel(f.latest.date)} 時点の累計利用額` : 'まだ記録がありません'}</div>
        <div class="big">${man(f.cur)}<small>円</small></div>
        <div class="sub">あと <b>${man(f.remain)}円</b> で${man(f.target)}円</div>
        <div class="gauge"><i style="width:${pct}%"></i></div>
        <div class="hero-row"><span>達成率 ${Math.floor(pct)}%</span><span>${f.lastDiff != null ? `前回比 ${signMan(f.lastDiff)}円` : ''}</span></div>
      </div>

      <div class="forecast">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div class="k">300万円に届くのは</div><span class="pill ${f.status.cls}">${f.status.label}</span>
        </div>
        <div class="v">${fcValue}</div>
        <div class="d" style="white-space:pre-wrap;">${fcDesc}</div>
      </div>

      <div class="grid2">
        <div class="stat"><div class="k">実績ペース（月平均）</div><div class="v">${f.paceSrc === 'actual' ? man(f.pace) : '—'}<small>${f.paceSrc === 'actual' ? '円' : ''}</small></div></div>
        <div class="stat"><div class="k">必要ペース（残り${Math.round(f.remainMonths)}か月）</div><div class="v">${man(f.needMonthly)}<small>円</small></div></div>
        <div class="stat"><div class="k">期間末の着地見込み</div><div class="v">${man(f.landing)}<small>円</small></div></div>
        <div class="stat"><div class="k">期間末までの過不足</div><div class="v" style="color:${f.landing >= f.target ? 'var(--green)' : '#B26A00'}">${signMan(f.landing - f.target)}<small>円</small></div></div>
      </div>

      <div class="msg ${msgCls}">${msg}</div>

      <div class="sec-label">推移</div>
      <div class="chart">${chartSVG(f)}
        <div class="legend"><span><i style="border-color:#0B308E"></i>実績</span><span><i style="border-color:#00AFF0; border-top-style:dashed"></i>見込み</span><span><i style="border-color:#F59E0B; border-top-style:dashed"></i>目標</span></div>
      </div>

      ${!f.latest ? `<button class="btn primary" id="firstAdd">最初の記録を入れる</button>` : ''}
      <div style="font-size:11px; color:var(--tertiary); line-height:1.6; margin:0 2px;">
        判定期間 ${mdLabel(state.settings.period_start)}〜${mdLabel(state.settings.period_end)}。ペースは期間開始からの平均${f.paceSrc === 'assumed' ? '（記録が1か月分たまるまでは設定の想定値）' : ''}。金額はANAの利用実績照会の累計をそのまま入れる前提の見込みです。
      </div>
    `;
    const ra = $('#remTap'); if (ra) ra.onclick = () => openSnapSheet(null);
    const fa = $('#firstAdd'); if (fa) fa.onclick = () => openSnapSheet(null);
  }

  // ===================== 記録 =====================
  function renderLog() {
    if (!state.snaps.length) {
      $('#logScroll').innerHTML = `<div class="empty">まだ記録がありません。<br>毎月末に、ANAの利用実績照会で見られる<br>「判定期間の累計利用額」を1つ入れるだけです。</div><button class="btn primary" id="logFirst">記録する</button>`;
      $('#logFirst').onclick = () => openSnapSheet(null);
      return;
    }
    const rows = [...state.snaps].reverse().map((s, i, arr) => {
      const prev = arr[i + 1];
      const diff = prev ? s.cumulative - prev.cumulative : null;
      return `<div class="row" data-id="${s.id}">
        <div class="main"><div class="ttl">${mdLabel(s.date)}</div><div class="meta">${s.note ? esc(s.note) : (diff != null ? `前回から${Math.round(monthsBetween(fromISO(prev.date), fromISO(s.date)) * 10) / 10}か月` : '最初の記録')}</div></div>
        <div class="amt">${man(s.cumulative)}円${diff != null ? `<small style="${diff < 0 ? 'color:#B26A00' : ''}">${signMan(diff)}円</small>` : ''}</div>
        <span class="chev">›</span>
      </div>`;
    }).join('');
    $('#logScroll').innerHTML = `<div class="sec-label">月末時点の累計利用額</div><div class="list">${rows}</div>
      <div style="font-size:11.5px; color:var(--tertiary); margin:0 2px; line-height:1.6;">緑の数字は前回からの増加分（その間に使った額）です。</div>`;
    $$('#logScroll .row').forEach(el => el.onclick = () => openSnapSheet(el.dataset.id));
  }

  function openSnapSheet(id) {
    const s = id ? state.snaps.find(x => x.id === id) : { id: uid(), date: defaultSnapDate(), cumulative: null, note: '' };
    const before = state.snaps.filter(x => x.id !== s.id && x.date < s.date).pop();
    openSheet(id ? '記録を編集' : '月末の記録', `
      <div class="field"><label>記録日</label><input type="date" id="sd" value="${s.date}"></div>
      <div class="field"><label>判定期間の累計利用額</label>
        <div class="inwrap"><input type="number" class="big" inputmode="decimal" step="0.1" id="sc" value="${s.cumulative != null ? yenToMan(s.cumulative) : ''}" placeholder="0"><span class="unit">万円</span></div>
        <div class="prev-note" id="scNote">${before ? `前回（${mdLabel(before.date)}）は ${man(before.cumulative)}円` : 'ANAの利用実績照会に出ている累計をそのまま入力'}</div>
      </div>
      <div class="field"><label>メモ（任意）</label><input type="text" id="sn" value="${esc(s.note || '')}" placeholder="旅行・家電・税金など"></div>
      ${id ? `<button class="del-btn" id="snapDel">この記録を削除</button>` : ''}
    `, async () => {
      const raw = $('#sc').value.trim();
      if (raw === '') { toast('累計利用額を入れてください'); return false; }
      const date = $('#sd').value || defaultSnapDate();
      // 同じ月の記録があれば上書き（月1件）
      const sameMonth = state.snaps.find(x => x.id !== s.id && x.date.slice(0, 7) === date.slice(0, 7));
      const rec = { id: sameMonth && !id ? sameMonth.id : s.id, date, cumulative: manToYen(raw), note: $('#sn').value.trim(), updatedAt: now() };
      await put('snapshots', rec);
      await loadAll(); renderAll(); toast(sameMonth && !id ? '同じ月の記録を更新しました' : '記録しました');
    });
    const inp = $('#sc');
    if (before) inp.oninput = () => {
      const d = manToYen(inp.value) - before.cumulative;
      $('#scNote').innerHTML = `前回（${mdLabel(before.date)}）は ${man(before.cumulative)}円 → 今回 <b>${signMan(d)}円</b>`;
    };
    const db = $('#snapDel');
    if (db) db.onclick = async () => { if (!confirm('この記録を削除しますか？')) return; closeSheet(); await del('snapshots', id); await loadAll(); renderAll(); toast('削除しました'); };
    if (!id) setTimeout(() => inp.focus(), 350);
  }

  // ===================== 設定 =====================
  function renderSettings() {
    const s = state.settings;
    $('#settingsScroll').innerHTML = `
      <div class="sec-label">判定期間</div>
      <div class="card">
        <div class="field"><label>開始日</label><input type="date" id="ps" value="${s.period_start}"></div>
        <div class="field" style="margin-bottom:0;"><label>終了日</label><input type="date" id="pe" value="${s.period_end}"></div>
      </div>
      <div class="sec-label">目標と想定ペース</div>
      <div class="card">
        <div class="field"><label>目標額</label><div class="inwrap"><input type="number" inputmode="decimal" id="ta" value="${yenToMan(s.target_amount)}"><span class="unit">万円</span></div></div>
        <div class="field" style="margin-bottom:0;"><label>想定月平均</label><div class="inwrap"><input type="number" inputmode="decimal" id="am" value="${yenToMan(s.assumed_monthly)}"><span class="unit">万円</span></div>
          <div class="hint">記録が1か月分たまるまでの試算に使います。以降は実績ペースで計算。</div></div>
      </div>
      <div class="sec-label">データ</div>
      <div class="card" style="padding:12px;">
        <button class="btn ghost" id="btnExport" style="margin-bottom:10px;">JSON書き出し</button>
        <button class="btn ghost" id="btnImport">JSON取り込み</button>
        <input type="file" id="importFile" accept="application/json" style="display:none;">
      </div>
      <div class="msg calm" style="font-size:12px;">制度の詳細や対象外の決済はANA公式情報を優先してください。アプリの数字は入力した累計からの見込みです。</div>
      <div style="text-align:center; padding:6px 0 20px; font-size:12px; color:var(--tertiary);">300万メーター v${APP_VERSION}</div>
    `;
    const save = async (patch) => { state.settings = { ...state.settings, ...patch, id: 'main' }; await put('settings', state.settings); renderHome(); renderLog(); };
    $('#ps').onchange = e => e.target.value && save({ period_start: e.target.value });
    $('#pe').onchange = e => e.target.value && save({ period_end: e.target.value });
    $('#ta').onchange = e => save({ target_amount: manToYen(e.target.value) || DEFAULTS.target_amount });
    $('#am').onchange = e => save({ assumed_monthly: manToYen(e.target.value) });
    $('#btnExport').onclick = exportData;
    $('#btnImport').onclick = () => $('#importFile').click();
    $('#importFile').onchange = (e) => { if (e.target.files[0]) importData(e.target.files[0]); e.target.value = ''; };
  }

  // ===================== sheet =====================
  let sheetSave = null;
  function openSheet(title, html, onSave) {
    $('#sheetTitle').textContent = title; $('#sheetBody').innerHTML = html; sheetSave = onSave;
    $('#sheetBg').classList.add('show'); $('#sheet').classList.add('show');
  }
  function closeSheet() { $('#sheetBg').classList.remove('show'); $('#sheet').classList.remove('show'); document.activeElement && document.activeElement.blur(); }
  $('#sheetCancel').onclick = closeSheet;
  $('#sheetBg').onclick = closeSheet;
  $('#sheetSave').onclick = async () => { if (sheetSave) { const r = await sheetSave(); if (r === false) return; } closeSheet(); };
  $('#homeAdd').onclick = () => openSnapSheet(null);
  $('#logAdd').onclick = () => openSnapSheet(null);

  // ===================== nav =====================
  const RENDER = { home: renderHome, log: renderLog, settings: renderSettings };
  function renderAll() { renderHome(); renderLog(); }
  function switchView(v) {
    $$('.view').forEach(el => el.classList.toggle('active', el.id === 'view-' + v));
    $$('.tab').forEach(b => b.classList.toggle('active', b.dataset.v === v));
    RENDER[v](); const sc = $('#view-' + v + ' .scroll'); if (sc) sc.scrollTop = 0;
  }
  $$('.tab').forEach(b => b.onclick = () => switchView(b.dataset.v));

  let toastT = null;
  function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1700); }

  // ===================== export / import =====================
  const SCHEMA = 'ana300.v2';
  function exportData() {
    const data = { schema: SCHEMA, exportedAt: new Date().toISOString(), settings: state.settings, snapshots: state.snaps };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = 'ana300-sync.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    toast('書き出しました');
  }
  async function importData(file) {
    try {
      const data = JSON.parse(await file.text());
      if (data.schema !== SCHEMA) { toast('対応していないファイルです'); return; }
      if (data.settings) { state.settings = { ...DEFAULTS, ...data.settings, id: 'main' }; await put('settings', state.settings); }
      const local = new Map(state.snaps.map(x => [x.id, x]));
      for (const it of (data.snapshots || [])) { const l = local.get(it.id); if (!l || (it.updatedAt || 0) > (l.updatedAt || 0)) await put('snapshots', it); }
      await loadAll(); switchView('home'); toast('取り込みました');
    } catch (e) { toast('読み込みに失敗しました'); }
  }

  // ===================== init =====================
  (async function init() {
    const vv = window.visualViewport;
    if (vv) { const apply = () => document.documentElement.style.setProperty('--app-height', vv.height + 'px'); vv.addEventListener('resize', apply); apply(); }
    await openDB(); await loadAll(); switchView('home');
  })();

  // ===================== SW auto-update =====================
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', async () => {
      try {
        const res = await fetch(new URL('sw.js', location.href).href, { method: 'HEAD' }); if (!res.ok) return;
        const reg = await navigator.serviceWorker.register('sw.js');
        if (reg.waiting && navigator.serviceWorker.controller) showUpdateBanner(reg.waiting);
        reg.addEventListener('updatefound', () => { const sw = reg.installing; if (!sw) return; sw.addEventListener('statechange', () => { if (sw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBanner(sw); }); });
        reg.update();
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { reg.update(); renderHome(); } });
        let refreshing = false; navigator.serviceWorker.addEventListener('controllerchange', () => { if (refreshing) return; refreshing = true; location.reload(); });
      } catch (e) {}
    });
  }
  function showUpdateBanner(w) {
    if (document.getElementById('updateBanner')) return;
    const b = document.createElement('button'); b.id = 'updateBanner';
    b.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg><span>新しいバージョンがあります — タップで更新</span>';
    b.onclick = () => { b.disabled = true; b.querySelector('span').textContent = '更新中…'; w.postMessage('SKIP_WAITING'); };
    document.body.appendChild(b); requestAnimationFrame(() => b.classList.add('show'));
  }
</script>
</body>
</html>
