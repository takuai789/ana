    $('#gd').onchange = e => { const v = e.target.value; if (!v || v > s.period_end || v < s.period_start) { toast('判定期間内の日付にしてください'); e.target.value = s.goal_deadline; return; } saveSheet({ goal_deadline: v }).then(after); };
    $('#ta').onchange = e => saveSheet({ target_amount: manToYen(e.target.value) || SHEET_DEFAULT.target_amount }).then(renderHome);
    $('#am').onchange = e => saveSheet({ assumed_monthly: manToYen(e.target.value) }).then(renderHome);
    $('#btnExport').onclick = exportData;
    $('#btnImport').onclick = () => $('#importFile').click();
    $('#importFile').onchange = (e) => { if (e.target.files[0]) importData(e.target.files[0]); e.target.value = ''; };
  }

  // ===================== sheet（下から出るパネル） =====================
  let sheetSave = null;
  function openSheet(title, html, onSave) { $('#sheetTitle').textContent = title; $('#sheetBody').innerHTML = html; sheetSave = onSave; $('#sheetBg').classList.add('show'); $('#sheet').classList.add('show'); }
  function closeSheet() { $('#sheetBg').classList.remove('show'); $('#sheet').classList.remove('show'); document.activeElement && document.activeElement.blur(); }
  $('#sheetCancel').onclick = closeSheet;
  $('#sheetBg').onclick = closeSheet;
  $('#sheetSave').onclick = async () => { if (sheetSave) { const r = await sheetSave(); if (r === false) return; } closeSheet(); };
  $('#homeAdd').onclick = () => openSnapSheet(null);
  $('#logAdd').onclick = () => openSnapSheet(null);
  $('#planAdd').onclick = () => openFixedSheet(null);

  // ===================== nav =====================
  const RENDER = { home: renderHome, log: renderLog, plan: renderPlan, tasks: renderTasks, settings: renderSettings };
  let currentView = 'home';
  function renderAll() { RENDER[currentView](); if (currentView !== 'home') renderHome(); }
  function switchView(v) {
    currentView = v;
    $$('.view').forEach(el => el.classList.toggle('active', el.id === 'view-' + v));
    $$('.tab').forEach(b => b.classList.toggle('active', b.dataset.v === v));
    RENDER[v](); const sc = $('#view-' + v + ' .scroll'); if (sc) sc.scrollTop = 0;
  }
  $$('.tab').forEach(b => b.onclick = () => switchView(b.dataset.v));

  let toastT = null;
  function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1700); }

  // ===================== export / import =====================
  const SCHEMA = 'ana300.v3';
  // iPhoneでは共有シート（「ファイルに保存」）、それ以外はダウンロード。成功したら日付を記録
  async function exportData() {
    const data = { schema: SCHEMA, exportedAt: new Date().toISOString(), prefs: state.prefs, sheets: state.sheets, snapshots: state.allSnaps, fixed: state.allFixed, tasks: state.allTasks, oneoffs: state.allOneoffs };
    const json = JSON.stringify(data, null, 2);
    const name = `ana300-backup-${todayISO().replace(/-/g, '')}.json`;
    let ok = false;
    try {
      const file = new File([json], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: '300万メーター バックアップ' }); ok = true; }
    } catch (e) { if (e && e.name === 'AbortError') { toast('書き出しをやめました'); return; } }
    if (!ok) {
      const url = URL.createObjectURL(new Blob([json], { type: 'application/json' })); const a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
      ok = true;
    }
    state.prefs = { ...state.prefs, last_backup: now(), backup_snooze: 0 }; await put('settings', state.prefs);
    toast('バックアップを書き出しました'); RENDER[currentView](); if (currentView !== 'home') renderHome();
  }
  async function mergeInto(storeName, items, local) {
    const m = new Map(local.map(x => [x.id, x]));
    for (const it of items || []) { const l = m.get(it.id); if (!l || (it.updatedAt || 0) > (l.updatedAt || 0)) await put(storeName, it); }
  }
  async function importData(file) {
    try {
      const data = JSON.parse(await file.text());
      if (data.schema === SCHEMA) {
        await mergeInto('sheets', data.sheets, state.sheets);
        await mergeInto('snapshots', data.snapshots, state.allSnaps);
        await mergeInto('fixed', data.fixed, state.allFixed);
        await mergeInto('tasks', data.tasks, state.allTasks);
        await mergeInto('oneoffs', data.oneoffs, state.allOneoffs);
      } else if (data.schema === 'ana300.v2') {   // v2.0〜2.1の書き出し → 今開いているシートへ
        await mergeInto('snapshots', (data.snapshots || []).map(s => ({ ...s, sheetId: s.sheetId || state.settings.id })), state.allSnaps);
      } else { toast('対応していないファイルです'); return; }
      await loadAll(); switchView('home'); toast('取り込みました');
    } catch (e) { toast('読み込みに失敗しました'); }
  }

  // ===================== init =====================
  (async function init() {
    const vv = window.visualViewport;
    if (vv) { const apply = () => document.documentElement.style.setProperty('--app-height', vv.height + 'px'); vv.addEventListener('resize', apply); apply(); }
    await openDB(); await loadAll(); switchView('home');
  })();

  // ===================== SW auto-update =====================
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', async () => {
      try {
        const res = await fetch(new URL('sw.js', location.href).href, { method: 'HEAD' }); if (!res.ok) return;
        const reg = await navigator.serviceWorker.register('sw.js');
        if (reg.waiting && navigator.serviceWorker.controller) showUpdateBanner(reg.waiting);
        reg.addEventListener('updatefound', () => { const sw = reg.installing; if (!sw) return; sw.addEventListener('statechange', () => { if (sw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBanner(sw); }); });
        reg.update();
        document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible') { reg.update(); await loadAll(); RENDER[currentView](); } });
        let refreshing = false; navigator.serviceWorker.addEventListener('controllerchange', () => { if (refreshing) return; refreshing = true; location.reload(); });
      } catch (e) {}
    });
  }
  function showUpdateBanner(w) {
    if (document.getElementById('updateBanner')) return;
    const b = document.createElement('button'); b.id = 'updateBanner';
    b.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg><span>新しいバージョンがあります — タップで更新</span>';
    b.onclick = () => { b.disabled = true; b.querySelector('span').textContent = '更新中…'; w.postMessage('SKIP_WAITING'); };
    document.body.appendChild(b); requestAnimationFrame(() => b.classList.add('show'));
  }
</script>
</body>
</html>
